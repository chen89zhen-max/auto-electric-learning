services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-electric-learning:local
    container_name: auto-electric-learning
    environment:
      NODE_ENV: production
      APP_DATA_DIR: /app/data
      DB_MIGRATIONS_DIR: /app/migrations
      HOST: 0.0.0.0
      PORT: 3000
      ENABLE_DEMO_SEED: "false"
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    profiles: ["maintenance"]
    image: auto-electric-learning:local
    entrypoint: ["node", "scripts/backup-sqlite.mjs"]
    environment:
      APP_DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
